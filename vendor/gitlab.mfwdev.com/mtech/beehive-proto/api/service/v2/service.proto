syntax = "proto3";

package beehive.service.v2;

option go_package = "gitlab.mfwdev.com/mtech/beehive-proto/api/service/v2";

option java_package = "com.mfw.atlas.provider.grpc";

// Instance 模型
message Instance {
    // 实例id
    string instanceId = 1;
    // 等级
    string level = 2 [deprecated = true];
    // 端口信息
    repeated PortInfo ports = 3;
    // 当前的ip地址
    string ip = 4;
    // 环境code
    string envCode = 5;
    // 环境类型
    string envType = 6;
    // 环境分组
    string envGroup = 7;
    // 当前实例的集群
    string cluster = 8;
    // 当前服务的版本
    string version = 9;
    // 是否处于上线的状态
    bool enabled = 11;
    // 实例状态，枚举值：starting（启动中）、probing（监控检测中）等、业务侧一般只关心实例是否在线，则取上一个字段：enabled 即可。
    string state = 12;
    // 健康检测结果
    // passed、checking、failed
    string healthState = 13 [deprecated = true];
    // 应用code
    string appCode = 14;
    // ecs or k8s
    string provider = 15;
    // 扩展参数
    map<string, string> label = 16;
    // hostname
    string hostname = 17;
    // 实例分配的 CPU
    float cpu = 18;
    // 实例分配的内存，单位是 MB
    int32 memory = 19;
    // 磁盘，单位 MB
    int32 disk = 20;
    // 操作系统
    string os = 21;
    // 镜像
    map<string, string> image = 22;
    // 机房信息
    string idc = 23;
    // 实例 reversion 。注意：这个值，是严格递增的（不一定增1），可能会持续变化。此值，只能推送方来改，主要是用来保证数据不被回滚的标识（需要发现中心适配）。
    int64 reversion = 24;
    // 实例状态  1：实例可用 2：实例摘除 0:其它
    int32 status = 25;
}

message PortInfo {
    // 端口名称：http、grpc、tcp
    string name = 1;
    // 端口协议：http、grpc、tcp
    string protocol = 2;
    // 实例端口号
    int32 port = 3;
    // 服务端口号
    // 1. 场景：实例开放的是 8080，需要映射到服务的 80 上，用户访问服务的80，会最终映射到实例的 8080 上。网关、SDK、底层网络 iptables 皆可使用
    // 2. 服务端口号与实例端口号相同，也可以不同。
    // 3. 此设计，参考 K8s Service 与 Pod 的映射关系。如果没有这个对应关系，网关侧将无法实现网关端口和实例端口的差异化映射。
    int32 servicePort = 4;
}

// 接口：实例列表

message InstanceList {
    // 实例列表
    repeated Instance instance = 1;
}

// 获取单个或多个 appcode 下的 instance 列表
message GetAppInstancesRequest {
    repeated string appCode = 1;
}

// 获取所有 instance 列表
message GetAllInstancesRequest {
    // 0下线 1上线 -1全量
    int32 status = 1;
    string provider = 2;
}

message CommonResponse {
    // 接口返回的 code ，0 为正常，非 0 异常
    int32 code = 1;
    string msg = 2;
}

// 同步全部 instance
message SynAllInstancesRequest {
    repeated Instance instance = 1;
    string provider = 2;
}

// 增量同步 instance
message SynInstancesRequest {
    repeated Instance instance = 1;
}

// 流式模式
message SubscribeOptions {
    // 是否订阅所有 appcode
    bool all = 1;
    // 指定订阅的 appcode 列表。如果同时设置了 all 的话，此参数优先级高
    repeated string appCode = 2;
    // 指定订阅某个环境下的实例
    repeated string envType = 3;
    // 指定订阅某个环境分组的实例
    repeated string envGroup = 4;
    // 指定订阅某个唯一环境的实例（优先级：envCode > envType > envGroup）
    repeated string envCode = 5;
    //

}

// 服务
service InstanceService {

    // 获取应用下的实例列表
    rpc getServiceInstances (GetAppInstancesRequest) returns (InstanceList) {}

    // 获取所有实例
    rpc getAllInstance (GetAllInstancesRequest) returns (InstanceList) {}

    // 全量同步实例
    rpc synAllInstance (SynAllInstancesRequest) returns (CommonResponse) {}

    // 增量同步实例
    rpc synInstance (SynInstancesRequest) returns (CommonResponse) {}

    // 流式订阅
    rpc subscribeInstance (SubscribeOptions) returns (stream Instance) {}

}